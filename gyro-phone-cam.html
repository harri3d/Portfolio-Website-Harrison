<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Camera</title>
<style>
  :root {
    --ink: #000;
    --yellow: #ffd60a;
    --red: #ff3b30;
    --hair: rgba(255,255,255,0.85);
    --dim: rgba(255,255,255,0.55);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: var(--ink); color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif;
    overflow: hidden; overscroll-behavior: none;
  }
  #stage { position: fixed; inset: 0; }
  canvas { display: block; touch-action: none; }

  /* ---------- pre-roll gate (setup only, not part of the "in-shot" look) ---------- */
  #gate {
    position: fixed; inset: 0; z-index: 80;
    background: #000;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 16px; padding: 32px; text-align: center;
  }
  #gate p { font-size: 13px; color: var(--dim); max-width: 300px; line-height: 1.6; margin: 0; }
  .btn {
    font-family: inherit; font-size: 15px; font-weight: 600;
    padding: 13px 30px; border-radius: 24px; border: none;
    background: #fff; color: #000; cursor: pointer;
  }
  .btn:active { transform: scale(0.96); }

  /* ---------- fake iOS status bar ---------- */
  #statusbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 20;
    height: calc(env(safe-area-inset-top, 20px) + 24px);
    padding: env(safe-area-inset-top, 20px) 22px 0;
    display: flex; align-items: center; justify-content: space-between;
    font-size: 15px; font-weight: 600; letter-spacing: -0.2px;
    pointer-events: none;
  }
  #statusbar .icons { display: flex; align-items: center; gap: 6px; }

  /* ---------- top camera chrome ---------- */
  #topbar {
    position: fixed; top: calc(env(safe-area-inset-top, 20px) + 28px); left: 0; right: 0; z-index: 20;
    height: 56px; display: flex; align-items: center; justify-content: center;
    pointer-events: none;
  }
  #flashIcon {
    position: absolute; left: 22px; top: 50%; transform: translateY(-50%);
    width: 30px; height: 30px; pointer-events: auto;
    display: flex; align-items: center; justify-content: center;
  }
  #recTimer {
    display: none; align-items: center; gap: 6px;
    background: rgba(40,40,40,0.55); border-radius: 12px;
    padding: 4px 10px 4px 8px; font-variant-numeric: tabular-nums;
    font-size: 15px; font-weight: 600;
  }
  #recTimer.show { display: flex; }
  #recTimer .dot {
    width: 8px; height: 8px; border-radius: 50%; background: var(--red);
    animation: pulse 1s infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: 0.3 } }

  /* ---------- bottom camera chrome ---------- */
  #bottombar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 10px);
    background: linear-gradient(to top, rgba(0,0,0,0.55), rgba(0,0,0,0));
  }
  #modes {
    display: flex; justify-content: center; gap: 22px;
    padding: 10px 0 4px; font-size: 13px; font-weight: 600;
    letter-spacing: 0.03em; color: var(--dim);
  }
  #modes .active { color: var(--yellow); }

  #controls {
    display: grid; grid-template-columns: 1fr auto 1fr;
    align-items: center; padding: 6px 30px calc(env(safe-area-inset-bottom, 0px) + 8px);
  }
  #thumb {
    width: 46px; height: 46px; border-radius: 9px;
    background: #1c1c1e; border: 1px solid rgba(255,255,255,0.25);
    justify-self: start;
  }
  #shutter {
    width: 74px; height: 74px; border-radius: 50%;
    border: 4px solid #fff; background: transparent;
    display: flex; align-items: center; justify-content: center;
    justify-self: center; padding: 0; cursor: pointer;
  }
  #shutter .core {
    width: 60px; height: 60px; border-radius: 50%;
    background: var(--red); transition: border-radius 0.18s ease, width 0.18s ease, height 0.18s ease;
  }
  #shutter.recording .core {
    width: 28px; height: 28px; border-radius: 6px;
  }
  #flip {
    width: 42px; height: 42px; border-radius: 50%;
    background: rgba(60,60,60,0.5);
    display: flex; align-items: center; justify-content: center;
    justify-self: end; cursor: pointer;
  }

  /* ---------- calibration ping (disguised as tap-to-focus) ---------- */
  #focusSquare {
    position: fixed; width: 78px; height: 78px; z-index: 25;
    border: 1px solid var(--yellow); border-radius: 3px;
    top: 50%; left: 50%; margin: -39px 0 0 -39px;
    opacity: 0; pointer-events: none;
  }
  #focusSquare.ping { animation: focusPing 0.6s ease-out; }
  @keyframes focusPing {
    0% { opacity: 1; transform: scale(1.3); }
    60% { opacity: 1; transform: scale(1); }
    100% { opacity: 0; transform: scale(1); }
  }

  /* ---------- settings sheet ---------- */
  #sheetBackdrop {
    position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,0.4);
    opacity: 0; pointer-events: none; transition: opacity 0.2s ease;
  }
  #sheetBackdrop.open { opacity: 1; pointer-events: auto; }
  #sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 61;
    background: #1c1c1e; border-radius: 16px 16px 0 0;
    padding: 10px 20px calc(env(safe-area-inset-bottom, 0px) + 24px);
    transform: translateY(100%); transition: transform 0.25s ease;
    font-size: 14px;
  }
  #sheet.open { transform: translateY(0); }
  #sheet .grabber {
    width: 36px; height: 5px; border-radius: 3px; background: rgba(255,255,255,0.25);
    margin: 4px auto 16px;
  }
  #sheet h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--dim); margin: 0 0 14px; }
  .field { margin-bottom: 18px; }
  .field label { display: flex; justify-content: space-between; margin-bottom: 6px; color: #fff; }
  .field label span.val { color: var(--dim); font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--yellow); }
  .file-btn, .action-btn {
    display: block; width: 100%; text-align: center; padding: 12px;
    border-radius: 10px; background: rgba(255,255,255,0.08); color: #fff;
    font-size: 14px; font-weight: 500; cursor: pointer; margin-top: 6px;
    border: none; font-family: inherit;
  }
  input[type=file] { display: none; }
  #closeSheet {
    position: absolute; top: 16px; right: 18px; color: var(--yellow); font-size: 14px; font-weight: 600;
  }
</style>
</head>
<body>

<div id="stage"></div>
<div id="focusSquare"></div>

<div id="statusbar">
  <span id="clock">9:41</span>
  <div class="icons">
    <svg width="18" height="12" viewBox="0 0 18 12" fill="none"><path d="M1 9L1 11M5 6L5 11M9 4L9 11M13 2L13 11" stroke="white" stroke-width="1.8" stroke-linecap="round"/></svg>
    <svg width="15" height="11" viewBox="0 0 15 11" fill="none"><path d="M1.5 4.5C4.5 1.5 10.5 1.5 13.5 4.5M4 7C6 5 9 5 11 7M6.5 9.3C7 8.9 8 8.9 8.5 9.3" stroke="white" stroke-width="1.6" stroke-linecap="round"/></svg>
    <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x="1" y="1" width="20" height="10" rx="2.5" stroke="white" stroke-width="1"/><rect x="2.5" y="2.5" width="15" height="7" rx="1.2" fill="white"/><rect x="22" y="4" width="2" height="4" rx="1" fill="white"/></svg>
  </div>
</div>

<div id="topbar">
  <div id="flashIcon">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="white"><path d="M13 2L4 14h6l-1 8 9-12h-6l1-8z"/></svg>
  </div>
  <div id="recTimer"><span class="dot"></span><span id="timerText">00:00</span></div>
</div>

<div id="bottombar">
  <div id="modes">
    <span>SLO-MO</span><span class="active">VIDEO</span><span>PHOTO</span>
  </div>
  <div id="controls">
    <div id="thumb"></div>
    <button id="shutter"><div class="core"></div></button>
    <div id="flip">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M17 2l4 4-4 4M7 22l-4-4 4-4M21 6H10a5 5 0 00-5 5v1M3 18h11a5 5 0 005-5v-1" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
  </div>
</div>

<div id="gate">
  <p>Setup only — this screen won't appear on camera. Tap to enable motion tracking, then hand off the phone.</p>
  <button class="btn" id="startBtn">Enable &amp; Begin</button>
</div>

<div id="sheetBackdrop"></div>
<div id="sheet">
  <div class="grabber"></div>
  <span id="closeSheet">Done</span>
  <h2>Rig Settings</h2>
  <div class="field">
    <label>Field of view <span class="val" id="fovVal">62&deg;</span></label>
    <input type="range" id="fovSlider" min="30" max="100" value="62">
  </div>
  <div class="field">
    <label>Yaw trim <span class="val" id="yawVal">0&deg;</span></label>
    <input type="range" id="yawTrim" min="-180" max="180" value="0">
  </div>
  <button class="file-btn" id="loadPanoBtn">Load equirectangular render&hellip;</button>
  <input type="file" id="panoInput" accept="image/*">
  <button class="action-btn" id="calBtn" style="margin-top:14px;">Re-zero forward now</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  'use strict';

  // ---------- clock ----------
  function pad(n){ return n < 10 ? '0'+n : ''+n; }
  function tickClock() {
    const d = new Date();
    let h = d.getHours() % 12; if (h === 0) h = 12;
    document.getElementById('clock').textContent = h + ':' + pad(d.getMinutes());
  }
  tickClock(); setInterval(tickClock, 15000);

  // ---------- three.js scene ----------
  const stage = document.getElementById('stage');
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  stage.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(62, window.innerWidth / window.innerHeight, 0.1, 10);
  camera.position.set(0, 0, 0);

  const sphereGeo = new THREE.SphereGeometry(5, 64, 40);
  sphereGeo.scale(-1, 1, 1);
  const sphereMat = new THREE.MeshBasicMaterial({ color: 0x222222 });
  const sphereMesh = new THREE.Mesh(sphereGeo, sphereMat);
  scene.add(sphereMesh);

  function animate() {
    requestAnimationFrame(animate);
    renderer.render(scene, camera);
  }
  animate();

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // ---------- placeholder equirectangular panorama ----------
  function buildPlaceholderPano() {
    const w = 2048, h = 1024;
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    const ctx = c.getContext('2d');

    const grad = ctx.createLinearGradient(0, 0, 0, h);
    grad.addColorStop(0, '#0d1013');
    grad.addColorStop(0.45, '#181d22');
    grad.addColorStop(0.55, '#14100f');
    grad.addColorStop(1, '#050403');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, w, h);

    ctx.strokeStyle = 'rgba(255,255,255,0.08)';
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.font = '20px monospace';
    ctx.textAlign = 'center';
    for (let deg = 0; deg < 360; deg += 30) {
      const x = (deg / 360) * w;
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();
      ctx.fillText(deg + '\u00B0', x, 30);
    }
    ctx.strokeStyle = 'rgba(255,255,255,0.18)';
    ctx.beginPath(); ctx.moveTo(0, h / 2); ctx.lineTo(w, h / 2); ctx.stroke();

    for (let i = 0; i < 6; i++) {
      ctx.fillStyle = `rgba(120,130,140,${0.02 + i * 0.01})`;
      ctx.fillRect(0, h * 0.4 + i * 14, w, 6);
    }

    const monsterDeg = 200;
    const mx = (monsterDeg / 360) * w;
    ctx.save();
    ctx.translate(mx, h * 0.52);
    ctx.fillStyle = '#050403';
    ctx.beginPath();
    ctx.moveTo(-60, 230);
    ctx.quadraticCurveTo(-90, 40, -30, -160);
    ctx.quadraticCurveTo(0, -230, 30, -160);
    ctx.quadraticCurveTo(90, 40, 60, 230);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = 'rgba(201,79,61,0.65)';
    ctx.beginPath(); ctx.ellipse(-14, -140, 5, 3, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(14, -140, 5, 3, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    ctx.textAlign = 'left';
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.font = '16px monospace';
    ctx.fillText('placeholder monster @ ' + monsterDeg + '\u00B0 — swap in your CG render', mx - 150, h * 0.52 + 260);
    ctx.fillStyle = 'rgba(255,255,255,0.45)';
    ctx.font = '18px monospace';
    ctx.fillText('CALIBRATE HERE = 0\u00B0', 40, h - 40);

    return new THREE.CanvasTexture(c);
  }

  function applyTexture(tex) {
    tex.wrapS = THREE.RepeatWrapping;
    if (THREE.SRGBColorSpace) tex.colorSpace = THREE.SRGBColorSpace;
    else tex.encoding = THREE.sRGBEncoding;
    sphereMat.map = tex;
    sphereMat.color.set(0xffffff);
    sphereMat.needsUpdate = true;
  }
  applyTexture(buildPlaceholderPano());

  document.getElementById('loadPanoBtn').addEventListener('click', () => {
    document.getElementById('panoInput').click();
  });
  document.getElementById('panoInput').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const url = URL.createObjectURL(file);
    new THREE.TextureLoader().load(url, applyTexture);
  });

  // ---------- FOV / yaw trim ----------
  const fovSlider = document.getElementById('fovSlider');
  const yawTrim = document.getElementById('yawTrim');
  let yawTrimRad = 0;
  fovSlider.addEventListener('input', () => {
    camera.fov = parseFloat(fovSlider.value);
    camera.updateProjectionMatrix();
    document.getElementById('fovVal').textContent = fovSlider.value + '\u00B0';
  });
  yawTrim.addEventListener('input', () => {
    yawTrimRad = THREE.MathUtils.degToRad(parseFloat(yawTrim.value));
    document.getElementById('yawVal').textContent = yawTrim.value + '\u00B0';
  });

  // ---------- device orientation -> quaternion (relative to calibration) ----------
  const DEG2RAD = Math.PI / 180;
  const zee = new THREE.Vector3(0, 0, 1);
  const q0 = new THREE.Quaternion();
  const q1 = new THREE.Quaternion(-Math.sqrt(0.5), 0, 0, Math.sqrt(0.5));
  const euler = new THREE.Euler();
  const deviceQuat = new THREE.Quaternion();
  const refInverse = new THREE.Quaternion();
  const relativeQuat = new THREE.Quaternion();
  const trimQuat = new THREE.Quaternion();
  let calibrated = false;
  let lastReading = { alpha: 0, beta: 0, gamma: 0 };

  function screenOrientAngle() {
    if (screen.orientation && typeof screen.orientation.angle === 'number') return screen.orientation.angle;
    if (typeof window.orientation === 'number') return window.orientation;
    return 0;
  }

  function computeDeviceQuaternion(alpha, beta, gamma) {
    euler.set(beta * DEG2RAD, alpha * DEG2RAD, -gamma * DEG2RAD, 'YXZ');
    deviceQuat.setFromEuler(euler);
    deviceQuat.multiply(q1);
    deviceQuat.multiply(q0.setFromAxisAngle(zee, -screenOrientAngle() * DEG2RAD));
    return deviceQuat;
  }

  function onOrientation(e) {
    if (e.alpha === null) return;
    lastReading = { alpha: e.alpha, beta: e.beta, gamma: e.gamma };
    const dq = computeDeviceQuaternion(e.alpha, e.beta, e.gamma);
    if (calibrated) {
      relativeQuat.copy(dq).premultiply(refInverse);
      trimQuat.setFromAxisAngle(new THREE.Vector3(0, 1, 0), yawTrimRad);
      camera.quaternion.copy(trimQuat).multiply(relativeQuat);
    }
  }

  function calibrate() {
    const dq = computeDeviceQuaternion(lastReading.alpha, lastReading.beta, lastReading.gamma);
    refInverse.copy(dq).invert();
    calibrated = true;
    const fs = document.getElementById('focusSquare');
    fs.classList.remove('ping'); void fs.offsetWidth; fs.classList.add('ping');
  }

  // double-tap anywhere on the viewfinder (not on chrome) re-zeros forward,
  // disguised as a tap-to-focus gesture
  let lastTap = 0;
  document.getElementById('stage').addEventListener('pointerdown', (e) => {
    const now = Date.now();
    if (now - lastTap < 300) {
      calibrate();
      lastTap = 0;
    } else {
      lastTap = now;
    }
  });

  // ---------- shutter (cosmetic record state + timer) ----------
  let recording = false, recStart = 0, timerHandle = null;
  document.getElementById('shutter').addEventListener('click', () => {
    recording = !recording;
    const btn = document.getElementById('shutter');
    const timer = document.getElementById('recTimer');
    if (recording) {
      btn.classList.add('recording');
      timer.classList.add('show');
      recStart = Date.now();
      timerHandle = setInterval(() => {
        const s = Math.floor((Date.now() - recStart) / 1000);
        document.getElementById('timerText').textContent = pad(Math.floor(s / 60)) + ':' + pad(s % 60);
      }, 250);
    } else {
      btn.classList.remove('recording');
      timer.classList.remove('show');
      clearInterval(timerHandle);
    }
  });

  // flash icon: purely cosmetic toggle
  document.getElementById('flashIcon').addEventListener('click', function () {
    this.style.opacity = this.style.opacity === '0.4' ? '1' : '0.4';
  });

  // ---------- settings sheet, opened via long-press on flip-camera icon ----------
  const sheet = document.getElementById('sheet');
  const backdrop = document.getElementById('sheetBackdrop');
  function openSheet() { sheet.classList.add('open'); backdrop.classList.add('open'); }
  function closeSheet() { sheet.classList.remove('open'); backdrop.classList.remove('open'); }
  document.getElementById('closeSheet').addEventListener('click', closeSheet);
  backdrop.addEventListener('click', closeSheet);

  let pressTimer = null;
  const flip = document.getElementById('flip');
  flip.addEventListener('pointerdown', () => { pressTimer = setTimeout(openSheet, 550); });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev =>
    flip.addEventListener(ev, () => clearTimeout(pressTimer))
  );

  document.getElementById('calBtn').addEventListener('click', () => { calibrate(); closeSheet(); });

  // ---------- start / permission gate ----------
  document.getElementById('startBtn').addEventListener('click', async () => {
    const needsPermission = typeof DeviceOrientationEvent !== 'undefined'
      && typeof DeviceOrientationEvent.requestPermission === 'function';
    if (needsPermission) {
      try {
        const result = await DeviceOrientationEvent.requestPermission();
        if (result !== 'granted') return;
      } catch (err) { return; }
    }
    window.addEventListener('deviceorientation', onOrientation, true);
    document.getElementById('gate').style.display = 'none';
    setTimeout(calibrate, 300);
  });
})();
</script>
</body>
</html>
